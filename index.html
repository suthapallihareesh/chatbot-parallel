                                </svg>
                              </button>
                              <button onClick={() => copyMessage(m.content)} title="Copy" style={{ border: "none", background: "transparent", cursor: "pointer", color: TEXT_MUTED, padding: "3px", borderRadius: "6px", display: "flex" }}>
                                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                                  <rect x="5.5" y="5.5" width="8" height="8.5" rx="1.3" stroke="currentColor" strokeWidth="1.3" fill="none" />
                                  <path d="M4 10.3H3a1 1 0 01-1-1V3a1 1 0 011-1h6.7a1 1 0 011 1v1.2" stroke="currentColor" strokeWidth="1.3" fill="none" />
                                </svg>
                              </button>
                              <button
                                onClick={() => speak(m.content, (msg) => setVoiceError(msg), true, voiceURI)}
                                title="Read this reply aloud"
                                style={{ border: "none", background: "transparent", cursor: "pointer", color: TEXT_MUTED, padding: "3px", borderRadius: "6px", display: "flex" }}
                              >
                                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                                  <path d="M2 6.3h2.4L8 3.3v9.4L4.4 9.7H2z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round" fill="none" />
                                  <path d="M10.8 5.5a3.3 3.3 0 010 5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" fill="none" />
                                </svg>
                              </button>
                              <button
                                onClick={() => setMessageReaction(col.id, m.id, "up")}
                                title="Good response"
                                style={{ border: "none", background: "transparent", cursor: "pointer", color: m.reaction === "up" ? SUCCESS : TEXT_MUTED, padding: "3px", borderRadius: "6px", display: "flex" }}
                              >
                                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                                  <path
                                    d="M5.5 6.5V13H3.8a.8.8 0 01-.8-.8V7.3a.8.8 0 01.8-.8h1.7zm0 0L8 2.5a1.3 1.3 0 012.4.9l-.6 3.1h3a1.3 1.3 0 011.2 1.8l-1.7 4a1.3 1.3 0 01-1.2.7H5.5"
                                    stroke="currentColor"
                                    strokeWidth="1.2"
                                    strokeLinejoin="round"
                                    fill="none"
                                  />
                                </svg>
                              </button>
                              <button
                                onClick={() => setMessageReaction(col.id, m.id, "down")}
                                title="Bad response"
                                style={{ border: "none", background: "transparent", cursor: "pointer", color: m.reaction === "down" ? ERROR : TEXT_MUTED, padding: "3px", borderRadius: "6px", display: "flex" }}
                              >
                                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" transform="rotate(180 8 8)">
                                  <path
                                    d="M5.5 6.5V13H3.8a.8.8 0 01-.8-.8V7.3a.8.8 0 01.8-.8h1.7zm0 0L8 2.5a1.3 1.3 0 012.4.9l-.6 3.1h3a1.3 1.3 0 011.2 1.8l-1.7 4a1.3 1.3 0 01-1.2.7H5.5"
                                    stroke="currentColor"
                                    strokeWidth="1.2"
                                    strokeLinejoin="round"
                                    fill="none"
                                  />
                                </svg>
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}

                  {loading[col.id] && (
                    <div style={{ display: "flex", gap: "4px", paddingLeft: "29px" }}>
                      <span className="tdot" style={{ width: "5px", height: "5px", borderRadius: "50%", background: providerDef.color, display: "inline-block" }} />
                      <span className="tdot" style={{ width: "5px", height: "5px", borderRadius: "50%", background: providerDef.color, display: "inline-block" }} />
                      <span className="tdot" style={{ width: "5px", height: "5px", borderRadius: "50%", background: providerDef.color, display: "inline-block" }} />
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ padding: "12px 20px 18px", flexShrink: 0 }}>
          {attachments.length > 0 && (
            <div style={{ display: "flex", gap: "6px", marginBottom: "8px", flexWrap: "wrap", maxWidth: "760px", margin: "0 auto 8px" }}>
              {attachments.map((a) => (
                <div key={a.id} style={{ display: "flex", alignItems: "center", gap: "6px", background: PANEL_BG_ALT, borderRadius: "8px", padding: "4px 8px", fontSize: "12px", border: BORDER }}>
                  {a.kind === "image" && <img src={a.dataUrl} alt={a.name} style={{ width: "18px", height: "18px", objectFit: "cover", borderRadius: "4px" }} />}
                  <span style={{ color: TEXT_SOFT }}>{a.name}</span>
                  <button onClick={() => removeAttachment(a.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: TEXT_MUTED }}>
                    ×
                  </button>
                </div>
              ))}
            </div>
          )}

          <div style={{ maxWidth: "760px", margin: "0 auto", display: "flex", alignItems: "flex-end", gap: "6px", border: BORDER, borderRadius: "20px", padding: "8px 8px 8px 16px", background: PANEL_BG, boxShadow: "0 6px 24px rgba(0,0,0,0.28)" }}>
            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ border: "none", background: "transparent", cursor: "pointer", color: TEXT_FAINT, flexShrink: 0, display: "flex", padding: "4px" }} aria-label="Attach file" title="Attach image or text file">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M11.5 3.5l-6 6a3 3 0 004.2 4.2l6-6a2 2 0 00-2.8-2.8l-5.7 5.7" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" fill="none" />
              </svg>
            </button>
            <input ref={fileInputRef} type="file" multiple style={{ display: "none" }} onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
            <button
              onClick={() => setWebSearchOn((v) => !v)}
              style={{
                border: "none",
                background: webSearchOn ? "rgba(217,164,65,0.14)" : "transparent",
                cursor: "pointer",
                color: webSearchOn ? ACCENT : TEXT_FAINT,
                flexShrink: 0,
                display: "flex",
                padding: "4px",
                borderRadius: "8px",
              }}
              aria-label="Toggle web search"
              title={webSearchOn ? "Web search on — used automatically wherever a model/provider supports it" : "Turn on web search (where supported)"}
            >
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <circle cx="9" cy="9" r="6.5" stroke="currentColor" strokeWidth="1.3" />
                <ellipse cx="9" cy="9" rx="2.7" ry="6.5" stroke="currentColor" strokeWidth="1.1" />
                <line x1="2.6" y1="9" x2="15.4" y2="9" stroke="currentColor" strokeWidth="1.1" />
                <path d="M3.6 5.3c1.3.9 3.3 1.5 5.4 1.5s4.1-.6 5.4-1.5M3.6 12.7c1.3-.9 3.3-1.5 5.4-1.5s4.1.6 5.4 1.5" stroke="currentColor" strokeWidth="1" fill="none" />
              </svg>
            </button>
            <button
              onClick={toggleListening}
              style={{
                border: "none",
                background: listening ? "rgba(226,124,124,0.14)" : "transparent",
                cursor: "pointer",
                color: listening ? ERROR : TEXT_FAINT,
                flexShrink: 0,
                display: "flex",
                padding: "4px",
                borderRadius: "8px",
              }}
              aria-label="Dictate a message"
              title={listening ? "Listening — click to stop and send" : "Speak your message (auto-sends when you stop talking)"}
            >
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect x="7" y="2" width="4" height="8" rx="2" fill="currentColor" />
                <path d="M4 8.5v1a5 5 0 0010 0v-1M9 14.5v2" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" fill="none" />
              </svg>
            </button>
            <textarea
              ref={textareaRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder={listening ? "Listening…" : "Message all active models..."}
              rows={1}
              style={{ flex: 1, resize: "none", background: "transparent", border: "none", color: TEXT_PRIMARY, fontFamily: "inherit", fontSize: "15px", lineHeight: 1.5, maxHeight: "160px", padding: "6px 0" }}
            />
            <button
              className="send-btn"
              onClick={() => handleSend()}
              disabled={anyBusy || (!input.trim() && attachments.length === 0)}
              style={{ width: "32px", height: "32px", borderRadius: "50%", border: "none", background: !anyBusy && (input.trim() || attachments.length) ? ACCENT : BORDER_COLOR, color: BG, cursor: !anyBusy && (input.trim() || attachments.length) ? "pointer" : "default", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}
            >
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 11V3M3 6.5L7 3l4 3.5" stroke={BG} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none" />
              </svg>
            </button>
          </div>
          {webSearchOn && (
            <div style={{ textAlign: "center", fontSize: "11px", color: TEXT_MUTED2, marginTop: "9px" }}>
              Web search is on — used automatically for Google, OpenRouter (any model), Groq's compound systems, and Groq's GPT-OSS models. Other providers here don't offer a request-level web search, so they'll answer from training data only.
            </div>
          )}
          {columns.some((c) => c.imageMode) && (
            <div style={{ textAlign: "center", fontSize: "11px", color: TEXT_MUTED2, marginTop: "9px" }}>
              One or more columns is set to generate images — whatever you type is sent as the image prompt to those columns instead of a chat message.
            </div>
          )}
        </div>
      </div>

      {showHistory && (
        <Modal title="Previous chats" onClose={() => setShowHistory(false)}>
          {historyList.length === 0 && <div style={{ fontSize: "13px", color: TEXT_MUTED, padding: "20px 4px" }}>No saved chats yet — conversations save here automatically as you go.</div>}
          {historyList
            .slice()
            .sort((a, b) => b.updatedAt - a.updatedAt)
            .map((entry) => (
              <div
                key={entry.id}
                className={"dropdown-item" + (entry.id === sessionIdRef.current ? " dropdown-item--accent" : "")}
                onClick={() => restoreHistoryEntry(entry)}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", padding: "10px 12px", borderRadius: "9px", cursor: "pointer", marginBottom: "4px", background: entry.id === sessionIdRef.current ? "rgba(217,164,65,0.1)" : "transparent" }}
              >
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ fontSize: "13.5px", color: TEXT_PRIMARY, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{entry.title || "New conversation"}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: "6px", marginTop: "3px" }}>
                    <span style={{ fontSize: "11.5px", color: TEXT_MUTED }}>{formatRelativeTime(entry.updatedAt)}</span>
                    <span style={{ fontSize: "11.5px", color: TEXT_FAINTEST }}>·</span>
                    <span style={{ fontSize: "11.5px", color: TEXT_MUTED }}>
                      {(entry.columns || []).map((c) => PROVIDER_DEFAULTS[c.provider] && PROVIDER_DEFAULTS[c.provider].label).filter(Boolean).join(", ")}
                    </span>
                  </div>
                </div>
                <button
                  onClick={(e) => deleteHistoryEntry(entry.id, e)}
                  title="Delete this chat"
                  style={{ border: "none", background: "transparent", color: TEXT_MUTED, cursor: "pointer", fontSize: "14px", flexShrink: 0, padding: "4px" }}
                >
                  ×
                </button>
              </div>
            ))}
        </Modal>
      )}

      {showLiveVoice && <LiveVoiceModal apiKey={providers.google.apiKey} onClose={() => setShowLiveVoice(false)} />}

      {voiceError && (
        <div style={{ position: "fixed", bottom: "22px", left: "50%", transform: "translateX(-50%)", background: PANEL_BG_ALT, border: "1px solid #3A2C2C", color: ERROR, borderRadius: "9px", padding: "9px 16px", fontSize: "12.5px", boxShadow: "0 8px 24px rgba(0,0,0,0.4)", zIndex: 60 }}>
          {voiceError}
        </div>
      )}

      {showSettings && (
        <Modal title="Provider settings" onClose={() => setShowSettings(false)} width="580px" maxHeight="85vh" padding="22px" headerMarginBottom="16px">
          {providerKeys.map((key) => (
            <div key={key} style={{ marginBottom: "16px", paddingBottom: "16px", borderBottom: DIVIDER }}>
              <ProviderKeyCard
                providerKey={key}
                def={PROVIDER_DEFAULTS[key]}
                savedKey={providers[key].apiKey}
                onSave={(k, v) => updateProvider(k, "apiKey", v)}
              />
              <label style={{ ...FIELD_LABEL_STYLE, marginTop: "12px", display: "block" }}>Default model for new columns</label>
              <div style={{ border: BORDER, background: BG, borderRadius: "8px", padding: "7px 11px", marginBottom: "9px", marginTop: "4px", display: "flex", alignItems: "center" }}>
                <ModelPicker
                  color={PROVIDER_DEFAULTS[key].color}
                  model={providers[key].defaultModel}
                  providerKey={key}
                  cacheEntry={modelsCache[key]}
                  onFetch={loadModels}
                  onSelect={(id) => updateProvider(key, "defaultModel", id)}
                />
              </div>
              <label style={FIELD_LABEL_STYLE}>Base URL</label>
              <input
                type="text"
                value={providers[key].baseUrl}
                onChange={(e) => updateProvider(key, "baseUrl", e.target.value)}
                style={{ ...FIELD_INPUT_STYLE, marginBottom: "9px" }}
              />
              <label style={FIELD_LABEL_STYLE}>Max reply length cap (tokens)</label>
              <input
                type="number"
                min="64"
                max="32000"
                value={providers[key].maxTokens}
                onChange={(e) => updateProvider(key, "maxTokens", Math.max(64, Number(e.target.value) || 4096))}
                style={FIELD_INPUT_STYLE}
              />
              <div style={{ fontSize: "11px", color: TEXT_MUTED, marginTop: "5px" }}>Just the upper limit — replies auto-size to the question. Lower this if a smaller model errors with "context length exceeded."</div>
            </div>
          ))}
        </Modal>
      )}

      {authModalStep === "setup" && (
        <Modal title="Connect Supabase" onClose={() => setAuthModalStep(null)}>
          <SupabaseSetupForm
            onSave={(cfg) => {
              saveSupabaseCfg(cfg);
              setAuthModalStep("signin");
            }}
          />
        </Modal>
      )}

      {authModalStep === "signin" && supabaseClient && (
        <Modal title="Sign in for Premium" onClose={() => setAuthModalStep(null)}>
          <AuthForm
            supabaseClient={supabaseClient}
            onSuccess={() => setAuthModalStep("premium")}
            onReconfigure={() => {
              reconfigureSupabase();
              setAuthModalStep("setup");
            }}
          />
        </Modal>
      )}

      {authModalStep === "premium" && session && (
        <Modal title="Upgrade to Premium" onClose={() => setAuthModalStep(null)}>
          <PremiumForm session={session} client={supabaseClient} onDone={() => setAuthModalStep(null)} />
        </Modal>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Chatbot />);
</script>
</body>
</html>
